cv:
  name: Yining He
  label: Ph.D. Candidate | Computational Materials Scientist
  email: heyinin1@msu.edu
  address:
    city: Detroit
    region: MI (open to relocation)
  summary: "Computational materials scientist with expertise in developing predictive models for electrochemical battery and gas sensor technologies. Expected graduation: February 2027."

  sections:
    Experience:
      - company: Michigan State University (MSU)
        position: Computational Materials Science Researcher (Ph.D.)
        location: East Lansing, MI
        start_date: 2020-11
        end_date: 2027-02
        summary: Anticipated completion February 2027.
        highlights:
          - Developed and validated machine-learning interatomic potentials (MLIPs) to accelerate Na-ion diffusion simulations for sodium-ion battery (SIB) electrodes while maintaining near-DFT accuracy, enabling larger system sizes and longer time scales on MSU's high-performance computing cluster.
          - Quantified structure-property relationships (e.g., Na<sup>+</sup> diffusion pathways, residence time) and converted them into design rules that guide experimental electrode selection for next-generation sodium-ion batteries.
          - Employed Monte Carlo simulations to predict H<sub>2</sub> solubility in ionic-liquid electrolytes for H<sub>2</sub> gas sensors, and designed and executed MD simulations of the Pt/ionic-liquid interface to characterize electric double layer (EDL) structure, ion transport, and H<sub>2</sub> behavior under sensing conditions.
          - Identified the electrolyte formulation that explains the higher H<sub>2</sub> sensitivity of the sensor, supporting safer hydrogen production, storage, transportation, and utilization.
          - Collaborated with experimentalists in electrochemistry and materials characterization to align simulation results with lab data, resolve discrepancies, and propose follow-up experiments.
          - Supervised 80+ undergraduate students in materials characterization labs (electrochemical tests - CA, CP, CV, PEIS; mechanical tests - tensile, hardness, fracture; structural tests - SEM, XRD) and answered questions for 100+ students.

      - company: Fraunhofer USA Center Midwest (CMW), Michigan State University
        position: 3D Printing Researcher
        location: East Lansing, MI
        start_date: 2017-11
        end_date: 2019-11
        highlights:
          - Designed and ran experiments to evaluate polymer filaments and process windows for Fused Deposition Modeling (FDM) 3D printing, correlating print parameters and microwave plasma treatments with mechanical performance (strength, hardness).
          - Formulated BaTiO<sub>3</sub>/PVDF polymer nanocomposite inks for flexible printed electronics, optimizing particle dispersion, viscosity, and curing profiles to improve mechanical properties.
          - Partnered with electrical engineers to integrate printed BaTiO<sub>3</sub>/PVDF nanocomposites into flexible circuit prototypes and characterize their electrical performance, contributing to a peer-reviewed publication.

      - company: Beijing Advanced Innovation Center for Food Nutrition, China Agricultural University (CAU)
        position: Pesticide Residue Analyst (summer positions)
        location: Beijing, China
        start_date: 2014
        end_date: 2015
        highlights:
          - Prepared pesticide-spiked liquor and agricultural product samples (kiwi, bean sprouts, raw grains) using rotary evaporation and other wet-chemistry techniques to enable quantitative residue analysis.
          - Performed pesticide residue testing and preliminary data analysis to evaluate food safety, contributing to a peer-reviewed publication as a co-author.

